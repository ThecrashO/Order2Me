<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order2Me - University Canteen Ordering</title>
    <meta name="description" content="Order2Me: The smart way to order food at your university canteen. Browse the menu and place orders in seconds.">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f97316">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Order2Me">
    <link rel="apple-touch-icon" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #0a0c12;
            --surface: rgba(255,255,255,0.06);
            --border:  rgba(255,255,255,0.10);
            --accent:  #f97316;
            --accent2: #fb923c;
            --text:    #f1f5f9;
            --muted:   #94a3b8;
        }

        html, body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 60% at 20% 10%,  rgba(249,115,22,.20) 0%, transparent 60%),
                radial-gradient(ellipse 60% 50% at 80% 80%,  rgba(251,146,60,.13) 0%, transparent 55%),
                radial-gradient(ellipse 50% 40% at 50% 50%,  rgba(15,23,42,1)     0%, transparent 80%);
            z-index: 0;
            animation: bgPulse 8s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            from { opacity: 1; }
            to   { opacity: .72; }
        }

        .floaties { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }

        .floatie {
            position: absolute;
            font-size: clamp(1.4rem, 2.5vw, 2.2rem);
            opacity: 0;
            animation: float linear infinite;
            user-select: none;
        }

        @keyframes float {
            0%   { opacity: 0;    transform: translateY(110vh) rotate(0deg); }
            10%  { opacity: 0.22; }
            90%  { opacity: 0.16; }
            100% { opacity: 0;    transform: translateY(-10vh) rotate(360deg); }
        }

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            text-align: center;
        }

        .badge-pill {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            background: rgba(249,115,22,.15);
            border: 1px solid rgba(249,115,22,.35);
            color: var(--accent2);
            font-size: .78rem;
            font-weight: 600;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: .35rem 1rem;
            border-radius: 999px;
            margin-bottom: 1.6rem;
            animation: fadeDown .6s ease both;
        }

        .badge-pill .dot {
            width: 7px; height: 7px;
            background: var(--accent);
            border-radius: 50%;
            animation: blink 1.4s ease-in-out infinite;
        }

        @keyframes blink {
            0%,100% { opacity: 1; transform: scale(1); }
            50%      { opacity: .4; transform: scale(.75); }
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .7rem;
            margin-bottom: 1.2rem;
            animation: fadeDown .7s .1s ease both;
        }

        .brand-logo {
            width: clamp(140px, 34vw, 220px);
            max-width: 100%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            border-radius: 50% !important;
            overflow: hidden;
            background: radial-gradient(circle at top, rgba(255,255,255,0.96), rgba(249,115,22,0.18));
            box-shadow: 0 0 0 8px rgba(249,115,22,0.14), 0 18px 42px rgba(249, 115, 22, 0.24);
            clip-path: circle(50% at center);
        }

        .brand-logo .o2m-logo-image {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            border-radius: 50%;
        }

        .brand-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--accent), #ef4444);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            box-shadow: 0 8px 32px rgba(249,115,22,.42);
            flex-shrink: 0;
        }

        .brand-name {
            font-size: clamp(2.4rem, 6vw, 4rem);
            font-weight: 900;
            letter-spacing: -.03em;
            background: linear-gradient(135deg, #fff 30%, var(--accent2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .tagline {
            font-size: clamp(1rem, 2.5vw, 1.28rem);
            color: var(--muted);
            max-width: 460px;
            line-height: 1.65;
            margin-bottom: 2.6rem;
            animation: fadeDown .7s .2s ease both;
        }

        .tagline strong { color: var(--text); font-weight: 600; }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: .7rem;
            background: linear-gradient(135deg, var(--accent) 0%, #ef4444 100%);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            padding: 1rem 2.4rem;
            border-radius: 999px;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 0 0 rgba(249,115,22,.5);
            transition: transform .22s ease, box-shadow .22s ease;
            animation: fadeDown .7s .3s ease both, pulseShadow 2.8s 1.5s ease-in-out infinite;
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,.18), transparent);
            opacity: 0;
            transition: opacity .2s;
        }

        .cta-btn:hover {
            transform: translateY(-3px) scale(1.04);
            box-shadow: 0 16px 40px rgba(249,115,22,.46);
            color: #fff;
            text-decoration: none;
        }

        .cta-btn:hover::before { opacity: 1; }
        .cta-btn:active { transform: scale(.98); }

        .cta-arrow { transition: transform .22s ease; }
        .cta-btn:hover .cta-arrow { transform: translateX(4px); }

        @keyframes pulseShadow {
            0%,100% { box-shadow: 0 0 0 0   rgba(249,115,22,.46); }
            50%      { box-shadow: 0 0 0 14px rgba(249,115,22,0);  }
        }

        .owner-link {
            margin-top: 1.6rem;
            font-size: .82rem;
            color: var(--muted);
            animation: fadeDown .7s .45s ease both;
        }

        .owner-link a {
            color: var(--muted);
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color .18s;
        }

        .owner-link a:hover { color: var(--text); }

        .features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: .65rem;
            margin-top: 3rem;
            animation: fadeDown .7s .5s ease both;
        }

        .feature-pill {
            display: flex;
            align-items: center;
            gap: .45rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: .45rem 1rem;
            font-size: .82rem;
            color: var(--muted);
            backdrop-filter: blur(8px);
        }

        .glow-line {
            width: 80px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 99px;
            margin: 2rem auto 0;
            animation: fadeDown .7s .6s ease both;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            .brand-logo {
                width: clamp(108px, 42vw, 150px);
                padding: 8px;
                box-shadow: 0 0 0 6px rgba(249,115,22,0.12), 0 10px 26px rgba(249, 115, 22, 0.22);
            }
            .brand-icon { width: 44px; height: 44px; font-size: 1.2rem; }
            .cta-btn { font-size: .95rem; padding: .85rem 2rem; }
        }
    </style>
</head>

<body>

    <div class="floaties" id="floaties"></div>

    <main class="page">

        <div class="badge-pill" role="status">
            <span class="dot"></span>
            Canteen is open
        </div>

        <div class="brand">
            <div class="brand-logo" aria-hidden="true">
                <img src="images/logo.png" alt="Order2Me logo" class="o2m-logo-image">
            </div>
        </div>

        <p class="tagline">
            Skip the queue. Order your favourite canteen food
            <strong>in seconds</strong> — straight from your phone.
        </p>

        <a href="student.html" class="cta-btn" id="start-ordering-btn">
            Start Ordering
            <svg class="cta-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true">
                <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
        </a>

        <p class="owner-link">
            Canteen staff? <a href="owner.html" id="owner-portal-link">Go to Owner Portal &rarr;</a>
        </p>

        <div class="features" aria-label="Features">
            <div class="feature-pill"><span aria-hidden="true">🧾</span> Live Menu</div>
            <div class="feature-pill"><span aria-hidden="true">⚡</span> Instant Orders</div>
            <div class="feature-pill"><span aria-hidden="true">💳</span> Easy Payment</div>
            <div class="feature-pill"><span aria-hidden="true">📍</span> Table Delivery</div>
        </div>

        <div class="glow-line" aria-hidden="true"></div>

    </main>

    <script>
        const emojis = ['🍕','🍔','🍜','🍣','🥗','🍛','🧆','🥙','🍱','🥤','🍩','🌮','🍗','🧁','🥘'];
        const container = document.getElementById('floaties');
        for (let i = 0; i < 18; i++) {
            const el = document.createElement('span');
            el.className = 'floatie';
            el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            const left     = Math.random() * 100;
            const duration = 12 + Math.random() * 16;
            const delay    = Math.random() * -22;
            el.style.cssText = `left:${left}%;animation-duration:${duration}s;animation-delay:${delay}s;`;
            container.appendChild(el);
        }
    </script>

</body>
</html>
