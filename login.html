<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order2Me Login</title>
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b1f3a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Order2Me">
    <link rel="apple-touch-icon" href="images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-shell">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card auth-card shadow-lg">
                    <div class="card-body">
                        <div class="d-flex align-items-center gap-3 mb-3">
                            <div class="auth-brand-mark" aria-hidden="true">
                                <img src="images/logo.png" alt="Order2Me logo" class="o2m-logo-image">
                            </div>
                            <div>
                                <div class="auth-badge">Fresh ordering</div>
                                <h3 class="auth-title mb-0">Welcome back</h3>
                            </div>
                        </div>
                        <p class="auth-subtitle">Sign in to continue fast, smooth canteen ordering.</p>
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="login-email" class="form-label">Email</label>
                                <input type="email" id="login-email" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="login-password" class="form-label">Password</label>
                                <div class="password-field">
                                    <input type="password" id="login-password" class="form-control" required
                                        autocomplete="current-password">
                                    <button type="button" class="password-visibility-toggle"
                                        onclick="togglePasswordVisibility('login-password', this)"
                                        aria-label="Show password" aria-pressed="false" title="Show password">
                                        <svg data-eye-open viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/>
                                            <circle cx="12" cy="12" r="3"/>
                                        </svg>
                                        <svg data-eye-closed class="d-none" viewBox="0 0 24 24" aria-hidden="true">
                                            <path d="M3 3l18 18"/><path d="M10.6 10.7a2 2 0 0 0 2.7 2.7"/>
                                            <path d="M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-2.1 3"/>
                                            <path d="M6.6 6.6C3.7 8.4 2 12 2 12s3.5 7 10 7a10 10 0 0 0 4.1-.9"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div id="login-status" class="text-danger mb-3"></div>
                            <button type="submit" class="btn btn-primary w-100">Sign In</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="signup.html">Create customer or shop-owner account</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/api/config"></script>
<script src="js/supabase.js?v=20"></script>
<script src="js/auth.js?v=18"></script>
<script src="js/login.js?v=20"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }
</script>
</body>
</html>
