<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order2Me — Shop Approval</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="images/logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="approval-shell">
    <section class="approval-card" aria-live="polite">
        <div class="approval-logo">
            <img src="images/logo.png" alt="Order2Me logo">
        </div>
        <div class="approval-status-icon" id="approval-status-icon">⏳</div>
        <div class="approval-kicker">Shop application</div>
        <h1 id="approval-heading">Waiting for approval</h1>
        <p id="approval-message">An administrator needs to review your shop before you can use the owner dashboard.</p>

        <div class="approval-shop-details" id="approval-shop-details">
            <div><span>Shop</span><strong id="approval-shop-name">Loading…</strong></div>
            <div><span>Status</span><strong id="approval-shop-status">Checking…</strong></div>
            <div><span>Location</span><strong id="approval-shop-address">—</strong></div>
        </div>

        <div class="alert alert-danger d-none mt-3" id="approval-reason"></div>
        <button class="btn btn-outline-secondary w-100 mt-3" onclick="refreshApprovalStatus()">Refresh status</button>
        <button class="btn btn-link text-danger w-100 mt-2" onclick="signOut()">Sign out</button>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="/api/config"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/pending.js"></script>
</body>
</html>
