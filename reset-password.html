<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password · Order2Me</title>
    <link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1f3a">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body><div class="auth-shell"><div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
    <div class="card auth-card shadow-lg"><div class="card-body">
        <div class="auth-badge">Secure recovery</div><h3 class="auth-title mt-2">Set a new password</h3>
        <p class="auth-subtitle">Choose a new password with at least 8 characters.</p>
        <form id="reset-password-form">
            <div class="mb-3"><label class="form-label" for="reset-password">New password</label>
                <input class="form-control" id="reset-password" type="password" minlength="8" required autocomplete="new-password"></div>
            <div class="mb-3"><label class="form-label" for="reset-password-confirm">Confirm new password</label>
                <input class="form-control" id="reset-password-confirm" type="password" minlength="8" required autocomplete="new-password"></div>
            <div class="mb-3" id="reset-status" role="status"></div>
            <button class="btn btn-primary w-100" type="submit">Change password</button>
        </form>
        <div class="text-center mt-3"><a href="login.html">Back to sign in</a></div>
    </div></div>
</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/api/config"></script><script src="js/supabase.js"></script>
<script src="js/auth.js?v=19"></script><script src="js/password-recovery.js?v=1"></script>
</body></html>
