<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · Order2Me</title>
    <link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1f3a">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body><div class="auth-shell"><div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
    <div class="card auth-card shadow-lg"><div class="card-body">
        <div class="auth-badge">Account recovery</div><h3 class="auth-title mt-2">Forgot your password?</h3>
        <p class="auth-subtitle">Enter your registered email. We will send you a secure password-reset link.</p>
        <form id="forgot-password-form">
            <div class="mb-3"><label class="form-label" for="forgot-email">Email</label>
                <input class="form-control" id="forgot-email" type="email" required autocomplete="email"></div>
            <div class="mb-3" id="forgot-status" role="status"></div>
            <button class="btn btn-primary w-100" type="submit">Send reset link</button>
        </form>
        <div class="text-center mt-3"><a href="login.html">Back to sign in</a></div>
    </div></div>
</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/api/config"></script><script src="js/supabase.js"></script>
<script src="js/auth.js?v=19"></script><script src="js/password-recovery.js?v=1"></script>
</body></html>
