<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order2Me Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h3 class="card-title mb-4 text-center">Student Sign Up</h3>
                    <form id="signup-form">
                        <div class="mb-3">
                            <label for="signup-name" class="form-label">Name</label>
                            <input type="text" id="signup-name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="signup-phone" class="form-label">Phone Number</label>
                            <input type="tel" id="signup-phone" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label for="signup-email" class="form-label">Email</label>
                            <input type="email" id="signup-email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="signup-password" class="form-label">Password</label>
                            <input type="password" id="signup-password" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="signup-confirm-password" class="form-label">Confirm Password</label>
                            <input type="password" id="signup-confirm-password" class="form-control" required>
                        </div>
                        <div id="signup-status" class="text-danger mb-3"></div>
                        <button type="submit" class="btn btn-success w-100">Create Account</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="login.html">Already have an account? Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
