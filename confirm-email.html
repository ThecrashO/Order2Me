<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Email · Order2Me</title>
    <link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1f3a">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body><div class="auth-shell"><div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-5">
    <div class="card auth-card shadow-lg"><div class="card-body">
        <div class="auth-badge">Email verification</div>
        <h3 class="auth-title mt-2">Enter confirmation code</h3>
        <p class="auth-subtitle">We sent an 8-digit code to your email. Enter it below to activate your account.</p>
        <div class="alert alert-warning py-2 small" role="note">
            <strong>Inbox ထဲမှာ code မတွေ့ဘူးလား?</strong><br>Spam သို့မဟုတ် Junk folder ကို စစ်ဆေးပါ။
        </div>
        <form id="confirm-email-form">
            <div class="mb-3"><label class="form-label" for="confirm-email">Email</label>
                <input class="form-control" id="confirm-email" type="email" required autocomplete="email"></div>
            <div class="mb-3"><label class="form-label" for="confirm-otp">Confirmation code</label>
                <input class="form-control auth-otp-input" id="confirm-otp" type="text" required
                    inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" maxlength="8"
                    placeholder="00000000"></div>
            <div class="mb-3" id="confirm-email-status" role="status"></div>
            <button class="btn btn-primary w-100" type="submit">Confirm email</button>
        </form>
        <p class="small text-muted text-center mt-3 mb-1">The code is valid for a limited time and can only be used once.</p>
        <div class="text-center"><a href="signup.html">Back to sign up</a></div>
    </div></div>
</div></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/api/config"></script><script src="js/supabase.js"></script>
<script src="js/auth.js?v=20"></script><script src="js/email-confirmation.js?v=1"></script>
</body></html>
