<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order2Me — Order History</title>
    <meta name="description" content="View your complete order history on Order2Me. Filter by date range, see full item breakdowns, and export records.">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Order2Me">
    <link rel="apple-touch-icon" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (history page only) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand:    '#f97316',
                        branddk:  '#c2410c',
                        hist:     '#c2410c',
                        histdk:   '#9a3412',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">

    <style>
        @keyframes fadeUp   { from { opacity:0; transform:translateY(18px) } to { opacity:1; transform:translateY(0) } }
        @keyframes spin     { to   { transform: rotate(360deg) } }
        @keyframes toastIn  { from { opacity:0; transform:translateX(30px) } to { opacity:1; transform:translateX(0) } }

        body  { font-family:'Inter',sans-serif; min-height:100vh;
                background:linear-gradient(135deg,#fff7ed 0%,#fff 50%,#f8fafc 100%); }

        /* Sticky header */
        .hist-header {
            position: sticky; top: 0; z-index: 50;
            background: rgba(255,255,255,.88);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid rgba(249,115,22,.16);
            box-shadow: 0 4px 24px rgba(15,23,42,.08);
        }

        /* Filter bar */
        .hist-range-btn {
            padding: 6px 16px; border-radius: 999px; border: 1.5px solid #e2e8f0;
            font-size:.82rem; font-weight:700; cursor:pointer;
            background:#fff; color:#64748b;
            transition: all .18s;
        }
        .hist-range-btn.active, .hist-range-btn:hover {
            background: linear-gradient(135deg,#c2410c,#9a3412);
            border-color: #c2410c; color: #fff;
        }

        /* Stats grid */
        .hist-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 14px;
            margin-bottom: 24px;
        }
        .hist-stat-card {
            background: linear-gradient(135deg,#fff,#f8fafc);
            border: 1px solid rgba(249,115,22,.18);
            border-radius: 16px;
            padding: 18px 16px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(249,115,22,.08);
            transition: transform .2s, box-shadow .2s;
        }
        .hist-stat-card:hover { transform:translateY(-3px); box-shadow:0 12px 28px rgba(249,115,22,.14); }
        .hist-stat-icon  { font-size:1.6rem; margin-bottom:6px; }
        .hist-stat-value { font-size:1.5rem; font-weight:900; color:#1e293b; line-height:1; }
        .hist-stat-label { font-size:.72rem; font-weight:600; color:#64748b; text-transform:uppercase; letter-spacing:.05em; margin-top:4px; }

        /* Cards list */
        .hist-cards-list { display:flex; flex-direction:column; gap:14px; }

        /* Individual card */
        .hist-card {
            background: linear-gradient(180deg,#fffefb,#fff7ed);
            border: 1px solid rgba(249,115,22,.18);
            border-radius: 18px;
            padding: 18px 20px;
            box-shadow: 0 8px 24px rgba(249,115,22,.08);
            animation: fadeUp .3s ease both;
            transition: transform .2s, box-shadow .2s;
        }
        .hist-card:hover { transform:translateY(-3px); box-shadow:0 14px 32px rgba(249,115,22,.14); }
        .hist-card-header {
            display:flex; justify-content:space-between; align-items:flex-start;
            margin-bottom:12px;
        }
        .hist-card-id   { font-weight:800; font-size:1rem; color:#1e293b; }
        .hist-card-meta { font-size:.78rem; color:#64748b; margin-top:2px; }
        .hist-card-items { margin-bottom:10px; }
        .hist-item-row  { display:flex; justify-content:space-between; font-size:.82rem; color:#475569; padding:3px 0; border-bottom:1px dashed #f1f5f9; }
        .hist-item-summary { font-size:.82rem; color:#64748b; line-height:1.5; margin-bottom:8px; }
        .hist-card-total  { font-weight:800; color:#c2410c; font-size:.95rem; margin-top:6px; }
        .hist-note { font-size:.78rem; color:#64748b; background:rgba(249,115,22,.07); border-left:3px solid #f97316; padding:6px 10px; border-radius:0 8px 8px 0; margin:8px 0; }

        /* Status badge */
        .hist-badge {
            display:inline-block; padding:3px 10px; border-radius:999px;
            font-size:.75rem; font-weight:700; color:#fff; white-space:nowrap;
        }

        /* Date group separator (customer view) */
        .hist-date-group { margin-bottom:24px; }
        .hist-date-label {
            font-size:.8rem; font-weight:800; color:#c2410c;
            text-transform:uppercase; letter-spacing:.06em;
            margin-bottom:10px;
            padding-bottom:6px;
            border-bottom:2px solid rgba(249,115,22,.18);
        }

        /* Loading state */
        .hist-loading { display:flex; align-items:center; gap:14px; padding:48px 24px; color:#64748b; font-weight:600; }
        .hist-spinner { width:28px; height:28px; border:3px solid #e2e8f0; border-top-color:#c2410c; border-radius:50%; animation:spin 0.8s linear infinite; }

        /* Error state */
        .hist-error { padding:24px; background:#fee2e2; border:1px solid #fecaca; border-radius:14px; color:#b91c1c; font-weight:600; }

        /* Empty state */
        .hist-empty { text-align:center; padding:56px 24px; color:#64748b; }
        .hist-empty-icon { font-size:3rem; margin-bottom:14px; }
        .hist-empty h3 { font-weight:800; color:#1e293b; margin-bottom:8px; }
        .hist-empty p  { font-size:.9rem; }

        /* Back/action button */
        .hist-back-btn {
            display:inline-block; margin-top:16px; padding:10px 22px;
            background:linear-gradient(135deg,#c2410c,#9a3412); color:#fff;
            border-radius:12px; font-weight:700; font-size:.9rem;
            text-decoration:none; transition:transform .18s, box-shadow .18s;
            box-shadow:0 6px 18px rgba(194,65,12,.22);
        }
        .hist-back-btn:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(194,65,12,.30); color:#fff; }

        .hist-hidden { display:none !important; }

        /* Export button */
        .hist-export-btn {
            background:linear-gradient(135deg,#047857,#065f46); border:none;
            color:#fff; padding:8px 18px; border-radius:12px; font-weight:700;
            font-size:.85rem; cursor:pointer; box-shadow:0 6px 18px rgba(4,120,87,.22);
            transition:transform .18s, box-shadow .18s;
        }
        .hist-export-btn:hover { transform:translateY(-2px); box-shadow:0 10px 24px rgba(4,120,87,.30); }

        /* Custom date inputs */
        .hist-date-input { border:1.5px solid #e2e8f0; border-radius:10px; padding:6px 12px; font-size:.85rem; font-weight:600; color:#1e293b; outline:none; }
        .hist-date-input:focus { border-color:#c2410c; box-shadow:0 0 0 3px rgba(249,115,22,.12); }

        /* Toast container */
        #hist-toast-container { position:fixed; bottom:24px; right:24px; z-index:9999; }

        /* Responsive tweaks */
        @media (max-width:640px) {
            .hist-card { padding:14px 14px; }
            .hist-stats-grid { grid-template-columns:repeat(2,1fr); }
        }
    </style>
</head>
<body>

<!-- ── Header ── -->
<header class="hist-header">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
            <!-- Back link -->
            <a id="hist-back-link" href="customer.html"
               class="flex items-center gap-1 text-sm font-bold text-orange-700 hover:text-orange-800 shrink-0"
               title="Back to Dashboard">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
                <span class="hidden sm:inline">Dashboard</span>
            </a>
            <div class="w-px h-5 bg-slate-200 hidden sm:block"></div>
            <div class="min-w-0">
                <h1 class="font-black text-base text-slate-800 leading-tight">📜 Order History</h1>
                <div class="text-xs text-slate-400 truncate" id="hist-user-name">Loading...</div>
            </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <span id="hist-role-badge"
                  class="text-xs font-bold px-3 py-1 rounded-full bg-orange-50 text-orange-700 border border-orange-100">
                Loading...
            </span>
            <button onclick="signOut()"
                    class="text-xs font-bold px-3 py-1 rounded-full bg-red-50 text-red-500 border border-red-100 hover:bg-red-100 transition">
                Sign Out
            </button>
        </div>
    </div>
</header>

<!-- ── Main ── -->
<main class="max-w-3xl mx-auto px-4 py-6">

    <!-- Owner Filter Bar (hidden for customers) -->
    <div id="owner-filter-bar" class="hist-hidden mb-6">

        <!-- Range preset buttons -->
        <div class="flex flex-wrap gap-2 mb-3 items-center">
            <span class="text-xs font-bold text-slate-500 uppercase tracking-widest mr-1">Period:</span>
            <button class="hist-range-btn active" data-range="yesterday" id="btn-yesterday">Yesterday</button>
            <button class="hist-range-btn" data-range="7days"     id="btn-7days">Last 7 Days</button>
            <button class="hist-range-btn" data-range="30days"    id="btn-30days">Last 30 Days</button>
            <button class="hist-range-btn" data-range="all"       id="btn-all">All Time</button>
            <button class="hist-range-btn" data-range="custom"    id="btn-custom">📅 Custom</button>
            <!-- Export CSV -->
            <button id="hist-export-btn" class="hist-export-btn ms-auto">
                ⬇ Export CSV
            </button>
        </div>

        <!-- Custom date picker (hidden by default) -->
        <div id="hist-custom-row" class="hist-hidden flex flex-wrap gap-3 items-center p-3 rounded-2xl bg-white border border-orange-100 shadow-sm">
            <div class="flex items-center gap-2">
                <label class="text-xs font-bold text-slate-500">From</label>
                <input type="date" id="hist-from-date" class="hist-date-input">
            </div>
            <div class="flex items-center gap-2">
                <label class="text-xs font-bold text-slate-500">To</label>
                <input type="date" id="hist-to-date" class="hist-date-input">
            </div>
            <button id="hist-custom-apply"
                    class="hist-export-btn px-4 py-2 text-sm">
                Apply
            </button>
        </div>
    </div>

    <!-- Content area (stats + cards rendered by JS) -->
    <div id="hist-content">
        <div class="hist-loading">
            <div class="hist-spinner"></div>
            <span>Authenticating...</span>
        </div>
    </div>

</main>

<!-- Toast container -->
<div id="hist-toast-container"></div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/api/config"></script>
<script src="js/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/history.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        });
    }
</script>

</body>
</html>
